name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env.local is gitignored, so create a placeholder so the build succeeds.
      # VIDEO_DIR is only read at request time (server-side), not at build time,
      # so an empty value here is fine — the real value is set on the NAS.
      - name: Create placeholder .env.local
        run: echo "VIDEO_DIR=" > .env.local

      - name: Build & assemble dist
        run: npm run deploy

      - name: Zip dist
        run: zip -r random-video-player.zip dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `random-video-player.zip`, unzip, and copy the contents to your NAS. Then run:
            ```
            sh start.sh
            ```
          files: random-video-player.zip
          make_latest: true
